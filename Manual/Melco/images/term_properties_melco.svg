<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="495" viewBox="0 0 660 495">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-hi { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.3; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="495" fill="#F8FAFC" rx="10" />

  <g transform="translate(26, 20)" filter="url(#winShadow)">
    <rect x="0" y="0" width="608" height="404" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 602 0 Q 608 0 608 6 L 608 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ — [MELSEC] タブ</text>

    <path d="M 14 62 L 14 42 Q 14 38 18 38 L 108 38 Q 112 38 112 42 L 112 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="63" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 114 62 L 114 40 Q 114 36 118 36 L 210 36 Q 214 36 214 40 L 214 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="164" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">MELSEC</text>

    <rect x="14" y="61" width="580" height="294" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="115" y1="61" x2="213" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox 1: シリアル通信設定 -->
    <rect x="28" y="76" width="552" height="92" class="grp-box" />
    <rect x="38" y="68" width="104" height="16" fill="#FFFFFF" />
    <text x="42" y="80" class="grp-lbl">シリアル通信設定</text>

    <text x="42" y="106" class="ui" font-size="11" fill="#334155">COMポート:</text>
    <rect x="122" y="90" width="150" height="24" class="input-hi" />
    <text x="130" y="106" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">COM10 (仮想COM)</text>
    <rect x="278" y="90" width="60" height="24" class="btn-box" />
    <text x="308" y="106" class="ui" font-size="11" fill="#1E293B" text-anchor="middle">更新</text>

    <text x="356" y="106" class="ui" font-size="11" fill="#334155">ボーレート:</text>
    <rect x="430" y="90" width="134" height="24" class="input-box" />
    <text x="440" y="106" class="mono" font-size="11.5" fill="#0F172A">9600</text>

    <text x="42" y="144" class="ui" font-size="11" fill="#334155">データビット:</text>
    <rect x="122" y="128" width="62" height="24" class="input-box" />
    <text x="132" y="144" class="mono" font-size="11.5" fill="#0F172A">7</text>

    <text x="196" y="144" class="ui" font-size="11" fill="#334155">パリティ:</text>
    <rect x="250" y="128" width="76" height="24" class="input-box" />
    <text x="260" y="144" class="mono" font-size="11.5" fill="#0F172A">Even</text>

    <text x="338" y="144" class="ui" font-size="11" fill="#334155">ストップ:</text>
    <rect x="392" y="128" width="52" height="24" class="input-box" />
    <text x="402" y="144" class="mono" font-size="11.5" fill="#0F172A">1</text>

    <text x="454" y="144" class="ui" font-size="11" fill="#334155">フロー:</text>
    <rect x="496" y="128" width="68" height="24" class="input-box" />
    <text x="504" y="144" class="mono" font-size="11.5" fill="#0F172A">None</text>

    <!-- GroupBox 2: MELSEC 計算機リンク仕様 -->
    <rect x="28" y="178" width="270" height="114" class="grp-box" />
    <rect x="38" y="170" width="150" height="16" fill="#FFFFFF" />
    <text x="42" y="182" class="grp-lbl">MELSEC 計算機リンク仕様</text>

    <text x="42" y="208" class="ui" font-size="11" fill="#334155">プロトコル:</text>
    <rect x="116" y="192" width="166" height="24" class="input-box" />
    <text x="124" y="208" class="mono" font-size="11.5" fill="#0F172A">形式4 (P4)</text>

    <text x="42" y="242" class="ui" font-size="11" fill="#334155">局番号:</text>
    <rect x="116" y="226" width="56" height="24" class="input-box" />
    <text x="124" y="242" class="mono" font-size="11.5" fill="#0F172A">0</text>
    <text x="182" y="242" class="ui" font-size="11" fill="#334155">PC番号:</text>
    <rect x="230" y="226" width="52" height="24" class="input-box" />
    <text x="238" y="242" class="mono" font-size="11.5" fill="#0F172A">255</text>

    <rect x="42" y="264" width="14" height="14" rx="2" fill="#94A3B8" />
    <text x="62" y="275" class="ui" font-size="10.5" fill="#475569">サムチェック自動照合 (固定)</text>

    <!-- GroupBox 3: 制御・タイムアウト -->
    <rect x="310" y="178" width="270" height="114" class="grp-box" />
    <rect x="320" y="170" width="114" height="16" fill="#FFFFFF" />
    <text x="324" y="182" class="grp-lbl">制御・タイムアウト</text>

    <text x="324" y="208" class="ui" font-size="11" fill="#334155">タイムアウト:</text>
    <rect x="412" y="192" width="90" height="24" class="input-box" />
    <text x="422" y="208" class="mono" font-size="11.5" fill="#0F172A">3000</text>
    <text x="510" y="208" class="ui" font-size="11" fill="#475569">ms</text>

    <text x="324" y="242" class="ui" font-size="11" fill="#334155">リトライ回数:</text>
    <rect x="412" y="226" width="90" height="24" class="input-box" />
    <text x="422" y="242" class="mono" font-size="11.5" fill="#0F172A">3</text>

    <rect x="324" y="264" width="14" height="14" rx="2" fill="#2563EB" />
    <text x="344" y="275" class="ui" font-size="11" fill="#1E293B">DTR</text>
    <rect x="412" y="264" width="14" height="14" rx="2" fill="#2563EB" />
    <text x="432" y="275" class="ui" font-size="11" fill="#1E293B">RTS</text>

    <!-- GroupBox 4: 設定概要 -->
    <rect x="28" y="302" width="552" height="42" class="grp-box" />
    <rect x="38" y="294" width="60" height="16" fill="#FFFFFF" />
    <text x="42" y="306" class="grp-lbl">設定概要</text>
    <text x="42" y="330" class="ui" font-size="11" fill="#475569">通信パラメータ:</text>
    <text x="140" y="330" class="mono" font-size="12" font-weight="700" fill="#1E3A8A">COM10: 9600,E,7,1 [P4, 局番:00]</text>

    <rect x="200" y="364" width="96" height="30" class="btn-pri" />
    <text x="248" y="383" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="312" y="364" width="96" height="30" class="btn-box" />
    <text x="360" y="383" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <rect x="26" y="436" width="608" height="44" class="callout-box" />
  <text x="42" y="455" class="ui" font-size="11" font-weight="700" fill="#92400E">メイン画面の［通信モード(M)］で「MELSEC」選択時に自動表示</text>
  <text x="42" y="472" class="ui" font-size="10.5" fill="#451A03">・PLC 計算機リンクユニット側の形式（P1〜P5）・局番・PC 番号（自局 255）とシリアル条件を一致させます。</text>
</svg>
